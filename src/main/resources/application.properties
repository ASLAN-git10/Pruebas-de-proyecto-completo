spring.application.name=proyecto-entidades

# Lee el .env en local (en Render no existe el archivo, usa las vars del sistema)
spring.config.import=optional:file:.env[.properties]

# Puerto: Render inyecta $PORT automaticamente, localmente usa 8081
server.port=${PORT:8081}

# ============================================
# PostgreSQL - variables de entorno
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# Logging
# ============================================
logging.level.root=WARN

# ============================================
# OpenAPI / Swagger / Scalar
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha